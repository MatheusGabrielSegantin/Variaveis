<!DOCTYPE html>
<html>
<head>
    <title>Conversão de Dias</title>
</head>
<body>

<script>

var dias = Number(prompt("Digite a quantidade de dias:"));

var horas = dias * 24;
var minutos = horas * 60;
var segundos = minutos * 60;

alert("Horas: " + horas);
alert("Minutos: " + minutos);
alert("Segundos: " + segundos);

</script>

</body>
</html>
