<!DOCTYPE html>
<html>
<head>
    <title>Valor por Pessoa</title>
</head>
<body>

<script>

var valor = Number(prompt("Digite o valor da conta:"));
var pessoas = Number(prompt("Digite a quantidade de pessoas:"));

var valorPessoa = valor / pessoas;

console.log("Cada pessoa paga: R$ " + valorPessoa);

</script>

</body>
</html>
