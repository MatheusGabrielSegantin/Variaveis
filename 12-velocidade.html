<!DOCTYPE html>
<html>
<head>
    <title>Velocidade Média</title>
</head>
<body>

<script>

var distancia = Number(prompt("Digite a distância:"));
var tempo = Number(prompt("Digite o tempo em horas:"));

var velocidade = distancia / tempo;

alert("Velocidade média: " + velocidade + " km/h");

</script>

</body>
</html>
