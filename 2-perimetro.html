<!DOCTYPE html>

    <title>Perímetro</title>
</head>
<body>

<script>

var comprimento = Number(prompt("Digite o comprimento:"));
var largura = Number(prompt("Digite a largura:"));

var perimetro = 2 * (comprimento + largura);

alert("Perímetro: " + perimetro);

</script>
