<!DOCTYPE html>
<html>
<head>
    <title>Comissão</title>
</head>
<body>

<script>

var vendas = Number(prompt("Digite o total vendido:"));
var porcentagem = Number(prompt("Digite a porcentagem de comissão:"));

var comissao = vendas * porcentagem / 100;
var total = vendas + comissao;

console.log("Comissão: R$ " + comissao);
console.log("Total recebido: R$ " + total);

</script>

</body>
</html>
