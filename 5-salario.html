<!DOCTYPE html>
<html>
<head>
    <title>Reajuste de Salário</title>
</head>
<body>

<script>

var salario = Number(prompt("Digite o salário:"));
var porcentagem = Number(prompt("Digite a porcentagem de aumento:"));

var aumento = salario * porcentagem / 100;
var novoSalario = salario + aumento;

console.log("Aumento: R$ " + aumento);
console.log("Novo salário: R$ " + novoSalario);

</script>

</body>
</html>
