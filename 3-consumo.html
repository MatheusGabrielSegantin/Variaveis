<!DOCTYPE html>
<html>
<head>
    <title>Consumo</title>
</head>
<body>

<script>

var distancia = Number(prompt("Digite a distância em km:"));
var combustivel = Number(prompt("Digite o combustível usado em litros:"));

var consumo = distancia / combustivel;

alert("Consumo médio: " + consumo + " km/l");

</script>

</body>
</html>
